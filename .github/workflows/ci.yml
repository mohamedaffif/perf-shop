name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/de_perfume_shop"
  AUTH_SECRET: "ci-placeholder-secret"
  REDIS_URL: "redis://localhost:6379"
  RABBITMQ_URL: "amqp://localhost:5672"
  RESEND_API_KEY: "re_ci_placeholder"
  RESEND_FROM_EMAIL: "ci@example.com"
  ADMIN_NOTIFICATION_EMAIL: "ci@example.com"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  PESAPAL_CONSUMER_KEY: "ci-placeholder-key"
  PESAPAL_CONSUMER_SECRET: "ci-placeholder-secret"
  PESAPAL_BASE_URL: "https://cybqa.pesapal.com/pesapalv3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
