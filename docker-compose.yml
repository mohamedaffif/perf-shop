services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: applies pending Prisma migrations, then exits 0.
  migrate:
    image: ${DOCKERHUB_USERNAME:-local}/de-perfume-shop-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      target: migrate
    env_file:
      - .env
    restart: "no"

  app:
    image: ${DOCKERHUB_USERNAME:-local}/de-perfume-shop:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SHOP_LIVE: ${NEXT_PUBLIC_SHOP_LIVE:-false}
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${DOCKERHUB_USERNAME:-local}/de-perfume-shop-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Production only: `docker compose --profile production up -d`
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Set SITE_ADDRESS (e.g. deperfumeshop.co.ke) and ACME_EMAIL in .env
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
