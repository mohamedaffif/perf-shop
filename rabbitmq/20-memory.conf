# RabbitMQ sizes its memory alarm from total host RAM, not the container's
# mem_limit. Without this it would assume the whole VPS (8 GB) is available,
# never apply flow control, and get OOM-killed at the 768m compose limit.
# Keep in sync with rabbitmq.mem_limit in docker-compose.yml.
total_memory_available_override_value = 768MB
vm_memory_high_watermark.relative = 0.6
